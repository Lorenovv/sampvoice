name: OMP control foundation

on:
  push:
    branches:
      - codex/manikular-voice-v41
  pull_request:
    paths:
      - 'omp-control/**'
      - '.github/workflows/omp-control.yml'

jobs:
  protocol-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure protocol test
        run: cmake -S omp-control -B build/protocol-test
      - name: Build protocol test
        run: cmake --build build/protocol-test --target protocol-test
      - name: Run protocol test
        run: ctest --test-dir build/protocol-test --output-on-failure

  component-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openmultiplayer/open.mp
          ref: v1.5.8.3079
          path: third_party/openmp
          submodules: recursive
      - name: Install 32-bit compiler support
        run: sudo apt-get update && sudo apt-get install -y g++-multilib
      - name: Configure component
        run: >-
          cmake -S omp-control -B build/component
          -DSAMPVOICE_OMP_BUILD_COMPONENT=ON
          -DOPENMP_SDK_ROOT=${{ github.workspace }}/third_party/openmp/SDK
          -DOPENMP_NETWORK_INCLUDE=${{ github.workspace }}/third_party/openmp/Shared/Network
          -DCMAKE_CXX_FLAGS=-m32
      - name: Build 32-bit component
        run: cmake --build build/component --target sampvoice-omp-control sampvoice-omp-probe
      - name: Check target architecture
        run: file build/component/sampvoice-omp-control.so | grep -F 'ELF 32-bit'
      - name: Upload test component
        uses: actions/upload-artifact@v4
        with:
          name: sampvoice-omp-control-linux-x86
          path: |
            build/component/sampvoice-omp-control.so
            build/component/sampvoice-omp-probe.so
          if-no-files-found: error
